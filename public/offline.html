<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline · KripFresh</title>
<style>
  body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#fff;color:#17251C;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
  .card{background:#EAF8EC;border-radius:24px;padding:28px;max-width:360px}
  button{margin-top:16px;min-height:48px;padding:0 24px;border:0;border-radius:16px;background:#17633A;color:#fff;font:600 16px Poppins,system-ui,sans-serif;cursor:pointer}
  button:focus-visible{outline:3px solid #17633A;outline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 8px">You’re offline</h1>
    <p style="margin:0">Your cart is saved on this device. Reconnect to keep shopping or to see the latest order status.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
